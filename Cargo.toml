[workspace]
members = [
    "acacia-commons",
    "acacia-data",
    "acacia-database",
    "acacia-derive",
    "acacia-game-msg",
    "acacia-game-server",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
byteorder = "1.5"
flate2 = "1.1"
dashmap = "6"
chrono = "0.4"

anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1"
csv = "1"

lazy_static = "1.5"
inventory = "0.3.21"

prost = "0.13"
prost-types = "0.13"
prost-build = "0.13"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
surrealdb = { version = "3", features = ["kv-surrealkv", "protocol-ws"] }
surrealdb-types = "3"

proc-macro2 = "1.0"
quote = "1.0.43"
syn = { version = "2.0.114", features = ["full"] }

acacia-commons = { path = "acacia-commons" }
acacia-data = { path = "acacia-data" }
acacia-database = { path = "acacia-database" }
acacia-derive = { path = "acacia-derive" }
acacia-game-msg = { path = "acacia-game-msg" }

[profile.release]
lto = "fat"
strip = "symbols"
opt-level = 3
panic = "abort"
codegen-units = 1
